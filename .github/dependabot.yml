version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # a release is only proposed once it has been out for a week, so that a compromised one is likely to be pulled before
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # minor and patch updates in one pull request each
      # major updates are left out of the groups, so each one gets its own pull request to look at
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
