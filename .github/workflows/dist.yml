name: Dist

# builds and packages the app on every operating system, used by the workflows that check or release it
on:
  workflow_call:
    inputs:
      # the version of a release (see scripts/version.js), stamped into package.json before packaging; empty keeps the one of package.json
      version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dist:
    name: Dist (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15-intel
            platform: darwin
          - os: windows-2025
            platform: win32
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/${{ matrix.platform }}/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/${{ matrix.platform }}/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/${{ matrix.platform }}
            ~/.electron-gyp
          key: build-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}-
            build-${{ matrix.platform }}-
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      # electron-builder bundles the flatpak from the runtime, the sdk and the base app, which it does not download itself
      - name: Install the Flatpak runtime
        if: runner.os == 'Linux'
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - run: npm ci
      - name: Set the version of the release
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/version.js "$VERSION"
      - run: npm run build
      - run: npm run dist
      - name: Check the contents of the package
        run: npm run check:dist
      # the packaged app has to start: a file missing from the package or a native module that does not load only shows here
      - name: Smoke test of the packaged app
        if: runner.os != 'Linux'
        run: npm run smoke:packaged
      # the installer carries a 32 bit build as well, which the 64 bit runner can start
      - name: Check the contents of the 32 bit package
        if: runner.os == 'Windows'
        run: npm run check:dist -- --ia32
      - name: Smoke test of the 32 bit packaged app
        if: runner.os == 'Windows'
        run: npm run smoke:packaged -- --ia32
      - name: Smoke test of the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:packaged
      # the sandbox, the finish args and the zypak wrapper of the bundle only show when the installed flatpak starts
      - name: Smoke test of the Flatpak bundle
        if: runner.os == 'Linux'
        run: |
          flatpak install --user --noninteractive --bundle dist/eMusic-*.flatpak
          xvfb-run --auto-servernum dbus-run-session npm run smoke:flatpak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/eMusic*
            dist/*.yml
          if-no-files-found: error
