name: Dist

# builds and packages the app on every operating system, used by the workflows that check or release it
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dist:
    name: Dist (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15-intel
            platform: darwin
          - os: windows-2025
            platform: win32
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/${{ matrix.platform }}/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/${{ matrix.platform }}/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/${{ matrix.platform }}
            ~/.electron-gyp
          key: build-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}-
            build-${{ matrix.platform }}-
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
      - run: npm run build
      - run: npm run dist
      - name: Check the contents of the package
        run: npm run check:dist
      # the packaged app has to start: a file missing from the package or a native module that does not load only shows here
      - name: Smoke test of the packaged app
        if: runner.os != 'Linux'
        run: npm run smoke:packaged
      - name: Smoke test of the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/eMusic*
            dist/*.yml
          if-no-files-found: error
