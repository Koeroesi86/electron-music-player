name: Dist

# builds and packages the app on every operating system, used by the workflows that check or release it
on:
  workflow_call:
    inputs:
      # the version of a release (see scripts/version.js), stamped into package.json before packaging; empty keeps the one of package.json
      version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dist:
    name: Dist (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-2025
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/${{ matrix.platform }}-${{ matrix.arch }}/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/${{ matrix.platform }}-${{ matrix.arch }}/electron-builder
      SPLIT_INSTALL: ${{ matrix.platform == 'win32' && matrix.arch == 'arm64' && inputs.version == '' && 'true' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/${{ matrix.platform }}-${{ matrix.arch }}
            ~/.electron-gyp
          key: build-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}-
            build-${{ matrix.platform }}-${{ matrix.arch }}-
      # the downloads of apt are kept between runs; the first try skips the update of the package lists, which needs the mirror, and falls back to it when a package is gone from there
      - name: Restore the packaging tools
        if: runner.os == 'Linux'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-flatpak-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: apt-flatpak-${{ matrix.arch }}-
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives/partial
          install() { sudo timeout 10m apt-get install -y -o Acquire::Retries=3 -o Dir::Cache::archives="$HOME/apt-archives" flatpak flatpak-builder; }
          install || { sudo timeout 10m apt-get update && install; }
          sudo chown -R "$USER" ~/apt-archives
      # saved when the install fails too: the mirror of x64 is slow at times, and the next run continues with the packages that were downloaded
      - name: Keep the packaging tools
        if: always() && runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-flatpak-${{ matrix.arch }}-${{ github.run_id }}
      # electron-builder bundles the flatpak from the runtime, the sdk and the base app, which it does not download itself
      # arm64 only: the download there takes the longest; the key names the runtime, so a new one downloads once and is kept
      - name: Restore the Flatpak runtime
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        id: flatpak-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-${{ matrix.arch }}-25.08
      - name: Install the Flatpak runtime
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - name: Keep the Flatpak runtime
        if: runner.os == 'Linux' && matrix.arch == 'arm64' && steps.flatpak-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-${{ matrix.arch }}-25.08
      # no prebuilt sqlite3 exists for Windows on arm64, so npm ci compiles it with node-gyp (6 minutes) and the rebuild for electron follows (1 minute)
      # there the compiled folder is kept outside of node_modules (npm ci empties it) and the scripts run after it is restored; a release compiles it afresh
      - name: Restore the compiled sqlite3
        if: env.SPLIT_INSTALL == 'true'
        id: sqlite3-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sqlite3-build
          key: sqlite3-${{ matrix.platform }}-${{ matrix.arch }}-node24-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: env.SPLIT_INSTALL != 'true'
      # the scripts of npm ci in the same order: the ones of the dependencies (sqlite3 only without a cache), then the postinstall of the project
      - name: Install the dependencies (compiled sqlite3 from the cache)
        if: env.SPLIT_INSTALL == 'true'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.sqlite3-cache.outputs.cache-hit }}
        run: |
          npm ci --ignore-scripts
          if [ "$CACHE_HIT" = "true" ]; then
            cp -R ~/sqlite3-build node_modules/sqlite3/build
          else
            npm rebuild sqlite3
          fi
          npm rebuild $(node -e "console.log(Object.entries(require('./package-lock.json').packages).filter(([name, entry]) => name.startsWith('node_modules/') && entry.hasInstallScript && name !== 'node_modules/sqlite3').map(([name]) => name.slice('node_modules/'.length)).join(' '))")
          npm run postinstall
          if [ "$CACHE_HIT" != "true" ]; then
            cp -R node_modules/sqlite3/build ~/sqlite3-build
          fi
      - name: Keep the compiled sqlite3
        if: env.SPLIT_INSTALL == 'true' && steps.sqlite3-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sqlite3-build
          key: sqlite3-${{ matrix.platform }}-${{ matrix.arch }}-node24-${{ hashFiles('package-lock.json') }}
      - name: Set the version of the release
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        # the default shell of Windows is PowerShell, where "$VERSION" is empty and the installer would keep the version of package.json
        shell: bash
        run: node scripts/version.js "$VERSION"
      - run: npm run build
      - run: npm run dist
      - name: Check the contents of the package
        run: npm run check:dist
      # the packaged app has to start: a file missing from the package or a native module that does not load only shows here
      - name: Smoke test of the packaged app
        if: runner.os != 'Linux'
        run: npm run smoke:packaged
      - name: Smoke test of the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:packaged
      # the sandbox, the finish args and the zypak wrapper of the bundle only show when the installed flatpak starts
      - name: Smoke test of the Flatpak bundle
        if: runner.os == 'Linux'
        run: |
          flatpak install --user --noninteractive --bundle dist/eMusic-*.flatpak
          xvfb-run --auto-servernum dbus-run-session npm run smoke:flatpak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/eMusic*
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error
