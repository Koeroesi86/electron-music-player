name: End to end

# starts the built app on every operating system and drives it with Playwright, listening to its audio (e2e/), used by the workflows that check the app
on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: End to end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/install-dependencies
      - run: npm run build
      # the audio goes to a sink that plays nothing (--disable-audio-output), so the runners need no sound device; Linux draws the window headless
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
