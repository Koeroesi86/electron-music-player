name: Test

# lint, dead code, types, unit tests with coverage and the Electron security scan, used by the workflows that package the app
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fallow
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Electron security scan
        if: runner.os == 'Linux'
        run: npm run security:electron
      - name: Coverage summary
        if: runner.os == 'Linux' && !cancelled()
        run: |
          {
            echo '### Coverage'
            node -e "const { total } = require('./coverage/coverage-summary.json'); Object.entries(total).forEach(([name, { pct }]) => console.log('- ' + name + ': ' + pct + '%'))"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && !cancelled()
        with:
          name: coverage
          path: coverage/lcov-report
          if-no-files-found: ignore
