name: Test

# lint, dead code, types, unit tests with coverage and the Electron security scan, used by the workflows that package the app
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fallow
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Electron security scan
        if: runner.os == 'Linux'
        run: npm run security:electron
      - name: Coverage summary
        if: runner.os == 'Linux' && !cancelled()
        run: |
          {
            echo '### Coverage'
            node -e "const { total } = require('./coverage/coverage-summary.json'); Object.entries(total).forEach(([name, { pct }]) => console.log('- ' + name + ': ' + pct + '%'))"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && !cancelled()
        with:
          name: coverage
          path: coverage/lcov-report
          if-no-files-found: ignore
