name: Pages

# The website (site/) on GitHub Pages. It is deployed when site/ changes on master, after every release (called by release.yml, so the version and the
# download links of the page are the ones of the release that was just published) and by hand. The latest release is written into the page while it is
# built (scripts/build-site.js), so the page needs no request to GitHub.
on:
  push:
    branches: [master]
    paths:
      - site/**
      - scripts/build-site.js
      - .github/workflows/pages.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time, and a running one is finished instead of cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the site with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > release.json
          node scripts/build-site.js release.json _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
