name: Security

# dependency scans, run on every pull request and on a schedule as well:
# an advisory published later than the pull request that added the dependency is found by the scheduled run
on:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

jobs:
  dependency-review:
    # compares the dependencies of the pull request with the ones of its base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # the app is distributed as binaries, so a copyleft dependency would have to be looked at (the LGPL libvips of sharp is linked dynamically)
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later

  # the lockfile against the OSV database, which covers more advisories than the GitHub one
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
