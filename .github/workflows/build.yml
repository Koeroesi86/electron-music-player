name: Build

on:
  push:
    branches: [master]
    tags: ['*']

permissions:
  contents: read

jobs:
  # the updater compares the installed version with the one of the release, so the tag has to match package.json
  version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag is the version of package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

  test:
    uses: ./.github/workflows/test.yml

  dist:
    needs: test
    uses: ./.github/workflows/dist.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: dist/*
