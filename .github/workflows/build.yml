name: Build

on:
  push:
    branches: [master]
    tags: ['*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  dist:
    needs: test
    uses: ./.github/workflows/dist.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
