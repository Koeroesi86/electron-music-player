language: node_js
node_js:
  - '9'
sudo: required
matrix:
  include:
    - os: linux
      dist: xenial
      env:
        - ELECTRON_CACHE=$HOME/.cache/electron
        - ELECTRON_BUILDER_CACHE=$HOME/.cache/electron-builder
    - os: osx
      osx_image: "xcode10"
      env:
        - ELECTRON_CACHE=$HOME/.cache/electron
        - ELECTRON_BUILDER_CACHE=$HOME/.cache/electron-builder
#before_cache:
#  - rm -rf $HOME/.cache/electron-builder/wine
cache:
  npm: true
  directories:
    - node_modules
    - $HOME/.cache/electron
    - $HOME/.cache/electron-builder
notifications:
  email: false
script:
  - npm ci
  - npm run build
  - npm run dist
deploy:
  skip_cleanup: true
  provider: releases
  api_key: $PUBLISH_TOKEN
  file_glob: true
  draft: true
  overwrite: true
  file: dist/*
  on:
    tags: true
